<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bridge demo</title>
<style>body{font-family:system-ui,sans-serif;margin:16px;background:#f6f7f9;color:#222}button{margin:3px;padding:6px 10px}pre{background:#fff;border:1px solid #ddd;padding:8px;height:220px;overflow:auto;font-size:12px}</style>
</head><body>
<h3>Brust bridge demo – <span id="who">?</span></h3>
<div>
  <button id="info">system.info</button>
  <button id="emit">emit → all apps</button>
  <button id="call">call other app: sum</button>
  <button id="exec">shell.exec</button>
  <button id="clip">clipboard.read</button>
  <button id="serial">serial.list</button>
  <button id="test">▶ Start test (local software "tester")</button>
  <button id="badge">ui.badge +1</button>
  <button id="notify">ui.notify</button>
  <button id="note">notes.append</button>
  <button id="printers">print.list</button>
</div>
<pre id="log"></pre>
<h4>Right-click a table cell: Copy table / row / column</h4>
<table id="orders" border="1" cellpadding="4" style="border-collapse:collapse;background:#fff;font-size:13px">
  <thead><tr><th>Order</th><th>Customer</th><th colspan="2">Quantity / Price</th></tr></thead>
  <tbody>
    <tr><td>PZ-001</td><td rowspan="2">Rossi S.p.A.</td><td>10</td><td>12,50 €</td></tr>
    <tr><td>PZ-002</td><td>4</td><td>99,00 €</td></tr>
    <tr><td>PZ-003</td><td>Bianchi s.r.l.</td><td>1</td><td>1.250,00 €</td></tr>
  </tbody>
</table>
<div role="grid" style="display:grid;grid-template-columns:repeat(3,auto);gap:2px;margin-top:10px;font-size:13px;max-width:360px">
  <div role="row" style="display:contents"><div role="columnheader"><b>Machine</b></div><div role="columnheader"><b>State</b></div><div role="columnheader"><b>OEE</b></div></div>
  <div role="row" style="display:contents"><div role="gridcell">Press 1</div><div role="gridcell">Running</div><div role="gridcell">87%</div></div>
  <div role="row" style="display:contents"><div role="gridcell">Lathe 2</div><div role="gridcell">Stopped</div><div role="gridcell">42%</div></div>
</div>
<script>
const log = (...a) => { const el = document.getElementById('log'); el.textContent = a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n' + el.textContent; };
window.addEventListener('brust:ready', () => {
  const p = window.brust;
  document.getElementById('who').textContent = p.appId + ' (pane ' + p.paneId + ')';
  const other = p.appId === 'crm' ? 'erp' : 'crm';
  p.on('*', (data, meta) => log('event', meta.event, 'from', meta.source, data));
  p.handle('sum', ({a, b}, ctx) => { log('sum called by', ctx.from); return a + b; });
  const run = (f) => f().then(r => log('ok', r)).catch(e => log('error', e.message));
  info.onclick = () => run(() => p.info());
  emit.onclick = () => { p.emit('greeting', {from: p.appId, time: new Date().toISOString()}, '*'); log('emitted'); };
  call.onclick = () => run(() => p.call(other, 'sum', {a: 2, b: 40}));
  exec.onclick = () => run(() => p.exec(navigator.platform.startsWith('Win') ? 'cmd' : 'uname', navigator.platform.startsWith('Win') ? ['/c','ver'] : ['-a']));
  clip.onclick = () => run(() => p.invoke('clipboard.read'));
  serial.onclick = () => run(() => p.invoke('serial.list'));
  let unread = 0;
  badge.onclick = () => run(() => p.invoke('ui.badge', { count: ++unread }));
  notify.onclick = () => run(() => p.invoke('ui.notify', { message: 'Test finished: OK', native: true }));
  note.onclick = () => run(() => p.invoke('notes.append', { notebook: 'Test log', text: '- ' + new Date().toISOString() + ' test PZ-001: OK' }));
  printers.onclick = () => run(() => p.invoke('print.list'));
  // Full flow: web app → client → local software → client → web app
  p.on('test.progress', d => log('progress', d.percent + '%', d.step));
  test.onclick = async () => {
    log('test request sent…');
    try {
      const result = await p.call('tester', 'startTest', { code: 'PZ-001', repetitions: 3 }, { timeout_ms: 60000 });
      log('RESULT', result);
    } catch (e) { log('test failed:', e.message); }
  };
  log('bridge ready', p.version);
});
</script></body></html>
