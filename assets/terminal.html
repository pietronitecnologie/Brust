<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Terminale</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; overflow: hidden; }
  #term { position: absolute; inset: 4px 0 0 6px; }
  .xterm .xterm-viewport { scrollbar-width: thin; scrollbar-color: #3a3f4b transparent; }
</style>
</head>
<body>
<div id="term"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script>
(function () {
  function post(m) { window.ipc.postMessage(JSON.stringify(m)); }
  var term = new Terminal({
    fontFamily: "'Cascadia Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace",
    fontSize: 13,
    cursorBlink: true,
    scrollback: 10000,
    allowProposedApi: true,
    theme: {
      background: "#0f1115", foreground: "#d7dae0", cursor: "#7aa2f7", selectionBackground: "#2d3f66",
      black: "#1d2026", red: "#f7768e", green: "#9ece6a", yellow: "#e0af68", blue: "#7aa2f7",
      magenta: "#bb9af7", cyan: "#7dcfff", white: "#c0caf5", brightBlack: "#565f89"
    }
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  var exited = false;

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  window.__pty_out = function (b64) { term.write(b64ToBytes(b64)); };
  window.__pty_exit = function () {
    exited = true;
    term.write("\r\n\x1b[2m[processo terminato – premi Invio per riavviare]\x1b[0m\r\n");
  };

  term.onData(function (d) {
    if (exited) {
      if (d === "\r") { exited = false; term.reset(); post({ t: "pty_restart", cols: term.cols, rows: term.rows }); }
      return;
    }
    post({ t: "pty_in", data: d });
  });

  term.attachCustomKeyEventHandler(function (e) {
    if (e.type !== "keydown") return true;
    if (e.ctrlKey && e.shiftKey && (e.key === "C" || e.key === "c")) {
      var sel = term.getSelection(); if (sel) post({ t: "copy", text: sel }); return false;
    }
    if (e.ctrlKey && e.shiftKey && (e.key === "V" || e.key === "v")) { post({ t: "paste" }); return false; }
    if (e.ctrlKey && e.key === "Tab") { post({ t: "shortcut", name: e.shiftKey ? "prev_tab" : "next_tab" }); return false; }
    if (e.altKey && e.key >= "1" && e.key <= "4") { post({ t: "shortcut", name: "focus_pane", index: +e.key - 1 }); return false; }
    return true;
  });

  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    var sel = term.getSelection();
    if (sel) { post({ t: "copy", text: sel }); term.clearSelection(); } else post({ t: "paste" });
  });
  window.addEventListener("pointerdown", function () { post({ t: "focus" }); }, true);

  var lastSize = "";
  function doFit() {
    try { fit.fit(); } catch (e) { return; }
    var s = term.cols + "x" + term.rows;
    if (s !== lastSize) { lastSize = s; post({ t: "pty_resize", cols: term.cols, rows: term.rows }); }
  }
  new ResizeObserver(function () { requestAnimationFrame(doFit); }).observe(document.body);
  doFit();
  post({ t: "pty_ready", cols: term.cols, rows: term.rows });
  term.focus();
  window.__term_focus = function () { term.focus(); };
})();
</script>
</body>
</html>
