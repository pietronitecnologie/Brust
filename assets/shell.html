<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brust</title>
<style>
:root {
  --bg: #15171c; --bar: #1b1e24; --panel: #20242b; --panel2: #262b33; --line: #2e333c;
  --text: #d9dde4; --muted: #8b93a1; --accent: #5b8cff; --accent2: #3d6ae0; --danger: #e5566a;
  --bar-h: 38px; --head-h: 26px;
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-size: 13px; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }

/* Top bar */
#bar { position: absolute; left: 0; right: 0; top: 0; height: var(--bar-h); background: var(--bar); border-bottom: 1px solid var(--line); display: flex; align-items: stretch; }
#tabs { display: flex; align-items: flex-end; gap: 2px; padding: 0 4px 0 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; min-width: 0; }
#tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 7px; height: 31px; padding: 0 6px 0 11px; min-width: 120px; max-width: 230px; border-radius: 8px 8px 0 0; color: var(--muted); background: transparent; cursor: default; position: relative; flex-shrink: 0; }
.tab:hover { background: #22262d; color: var(--text); }
.tab.active { background: var(--bg); color: var(--text); }
.tab.active::after { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 2px; background: var(--accent); }
.tab .ico { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
.tab .lbl { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab .lay { opacity: .55; display: flex; }
.tab .x { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; opacity: 0; color: var(--muted); }
.tab:hover .x, .tab.active .x { opacity: 1; }
.tab .x:hover { background: #333a45; color: var(--text); }
.tab input { width: 100%; background: #101216; border: 1px solid var(--accent); color: var(--text); border-radius: 4px; padding: 1px 4px; outline: none; }
.tab.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
#newtab { align-self: center; width: 28px; height: 28px; border-radius: 7px; font-size: 18px; color: var(--muted); flex-shrink: 0; margin-left: 2px; }
#newtab:hover { background: #2a2f37; color: var(--text); }
#spacer { flex: 1; }
#tools { display: flex; align-items: center; gap: 2px; padding: 0 8px; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
.tb { height: 28px; min-width: 30px; padding: 0 6px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.tb:hover { background: #2a2f37; color: var(--text); }
.tb.on { background: #263453; color: #cfdcff; }
.tb svg { display: block; }

/* Tile area */
#stage { position: absolute; left: 0; right: 0; bottom: 0; top: var(--bar-h); }
.pane { position: absolute; }
.ph { position: absolute; left: 0; right: 0; top: 0; height: var(--head-h); display: flex; align-items: center; gap: 6px; padding: 0 4px 0 9px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 7px 7px 0 0; color: var(--muted); font-size: 12px; cursor: grab; }
.pane.focused .ph { color: var(--text); background: var(--panel2); box-shadow: inset 0 2px 0 var(--accent); }
.ph .ico { width: 16px; text-align: center; }
.ph .ttl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ph .ttl small { color: var(--muted); margin-left: 6px; }
.ph .hb { width: 22px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); }
.ph .hb:hover { background: #343b47; color: var(--text); }
.ph .hb.close:hover { background: #4a2730; color: #ffb3bf; }
.pane.drop .ph { background: #263453; }
.pb { position: absolute; left: 0; right: 0; bottom: 0; top: var(--head-h); background: #111317; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 7px 7px; overflow: auto; }
.pb.live { background: #fff0; }

/* Content picker */
.picker { padding: 22px 24px; max-width: 760px; margin: 0 auto; user-select: none; }
.picker h3 { margin: 18px 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.picker h3:first-child { margin-top: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.card { text-align: left; padding: 11px 12px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; min-width: 0; }
.card:hover { border-color: var(--accent); background: #232a38; }
.card .ci { width: 30px; height: 30px; border-radius: 8px; background: #2a303a; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
.card .ct { min-width: 0; }
.card .cn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cu { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.urlrow { display: flex; gap: 8px; }
.urlrow input { flex: 1; min-width: 0; background: #0f1115; border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 8px 10px; outline: none; user-select: text; }
.urlrow input:focus { border-color: var(--accent); }
.btn { padding: 7px 14px; border-radius: 8px; background: var(--accent2); color: white; font-weight: 600; }
.btn:hover { background: var(--accent); }
.btn.ghost { background: #2a2f37; color: var(--text); font-weight: 500; }
.btn.ghost:hover { background: #343a44; }
.empty-hint { color: var(--muted); font-size: 12px; }

/* Splitters */
.sp { position: absolute; z-index: 5; }
.sp::after { content: ""; position: absolute; border-radius: 2px; background: transparent; transition: background .12s; }
.sp.x { cursor: col-resize; } .sp.y { cursor: row-resize; }
.sp.x::after { left: calc(50% - 1px); width: 2px; top: 30%; bottom: 30%; }
.sp.y::after { top: calc(50% - 1px); height: 2px; left: 30%; right: 30%; }
.sp:hover::after, .sp.drag::after { background: var(--accent); top: 0; bottom: 0; left: 0; right: 0; }
.sp.x:hover::after, .sp.x.drag::after { left: calc(50% - 1px); right: auto; width: 2px; }
.sp.y:hover::after, .sp.y.drag::after { top: calc(50% - 1px); bottom: auto; height: 2px; }
body.dragging-x, body.dragging-x * { cursor: col-resize !important; }
body.dragging-y, body.dragging-y * { cursor: row-resize !important; }

/* Settings */
#overlay { position: absolute; inset: 0; background: rgba(8, 9, 12, .72); display: none; z-index: 50; }
#overlay.show { display: grid; place-items: center; }
.dlg { width: min(760px, 92vw); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); user-select: text; }
.dlg h2 { margin: 0 0 4px; font-size: 17px; }
.dlg h4 { margin: 18px 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dlg .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.dlg table { width: 100%; border-collapse: collapse; font-size: 12px; }
.dlg td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.dlg td:first-child { white-space: nowrap; }
.dlg code { background: #14161a; padding: 1px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 12px; }
.err { background: #3a1f25; border: 1px solid #6b2c38; color: #ffc2cc; padding: 8px 10px; border-radius: 8px; margin: 8px 0; }
.kbd { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.kbd b { color: var(--text); font-weight: 500; }
.badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 700; display: inline-grid; place-items: center; flex-shrink: 0; }
.kiosk .tab .x, .kiosk #newtab, .kiosk #layouts, .kiosk #tools .sep { display: none !important; }
.priv { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 8px; user-select: none; }
/* Modal (confirmation, lock screen, PIN) */
#modal { position: absolute; inset: 0; z-index: 80; display: none; place-items: center; background: rgba(8, 9, 12, .78); }
#modal.show { display: grid; }
#modal.lock { background: radial-gradient(circle at 50% 35%, #1d2230, #0c0d11 70%); }
.mbox { width: min(520px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.55); user-select: text; }
.mbox h3 { margin: 0 0 10px; font-size: 16px; }
.mbox p { margin: 6px 0; color: var(--muted); line-height: 1.45; }
.mbox pre { background: #101216; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; font-family: Consolas, monospace; font-size: 12px; max-height: 180px; overflow: auto; color: var(--text); }
.mbox .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.btn.danger { background: #4a2730; color: #ffc2cc; }
.btn.danger:hover { background: #5c2f3a; }
.pin { width: 100%; background: #0f1115; border: 1px solid var(--line); border-radius: 9px; color: var(--text); padding: 10px 12px; font-size: 18px; letter-spacing: .3em; text-align: center; outline: none; margin-top: 10px; }
.pin:focus { border-color: var(--accent); }
.pinerr { color: #ff9aaa; min-height: 18px; margin-top: 6px; font-size: 12px; text-align: center; }
/* Command palette */
#palette { position: absolute; inset: 0; z-index: 70; display: none; justify-content: center; align-items: flex-start; padding-top: 12vh; background: rgba(8, 9, 12, .55); }
#palette.show { display: flex; }
.pal { width: min(620px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.55); overflow: hidden; }
#palq { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); padding: 14px 16px; font-size: 15px; outline: none; }
#pall { max-height: 52vh; overflow: auto; padding: 6px; }
.pi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.pi .pic { width: 22px; text-align: center; }
.pi .pil { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pi .pih { color: var(--muted); font-size: 11px; }
.pi.sel { background: #263453; }
.dlg .grid2 { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.dlg input.f { background: #0f1115; border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 6px 9px; outline: none; }
.dlg input.f:focus { border-color: var(--accent); }
.dlg .muted { color: var(--muted); font-size: 12px; }
.dlg .mini { padding: 3px 9px; font-size: 12px; }
#auditbox { max-height: 260px; overflow: auto; font-family: Consolas, monospace; font-size: 11.5px; background: #101216; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-top: 8px; display: none; }
#auditbox div { padding: 2px 0; border-bottom: 1px solid #1c1f25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast { position: absolute; left: 50%; top: 4px; height: 30px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translateX(-50%); background: #263453; border: 1px solid #3d6ae0; color: #dfe7ff; padding: 7px 14px; border-radius: 8px; display: none; z-index: 60; max-width: 80vw; }
</style>
</head>
<body>
<div id="bar">
  <div id="tabs"></div>
  <button id="newtab" title="New tab (Ctrl+T)">+</button>
  <div id="spacer"></div>
  <div id="tools">
    <div id="layouts" style="display:flex;gap:2px"></div>
    <div class="sep"></div>
    <button class="tb" id="reload" title="Reload tab / tileset (F5)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
    </button>
    <button class="tb" id="settings" title="Settings and bridge">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
  </div>
</div>
<div id="stage"></div>
<div id="overlay"><div class="dlg" id="dlg"></div></div>
<div id="modal"></div>
<div id="palette"><div class="pal"><input id="palq" placeholder="Type a command, an app, a tab…" spellcheck="false"><div id="pall"></div></div></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var S = null;
  var send = function (cmd, extra) { window.ipc.postMessage(JSON.stringify(Object.assign({ cmd: cmd }, extra || {}))); };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  // Layout icons (18x14 rectangles)
  var LAYOUT_RECTS = {
    "1": [[0, 0, 18, 14]],
    "2h": [[0, 0, 8.5, 14], [9.5, 0, 8.5, 14]],
    "2v": [[0, 0, 18, 6.5], [0, 7.5, 18, 6.5]],
    "3c": [[0, 0, 5.3, 14], [6.3, 0, 5.4, 14], [12.7, 0, 5.3, 14]],
    "3l": [[0, 0, 9.5, 14], [10.5, 0, 7.5, 6.5], [10.5, 7.5, 7.5, 6.5]],
    "3t": [[0, 0, 18, 7], [0, 8, 8.5, 6], [9.5, 8, 8.5, 6]],
    "4": [[0, 0, 8.5, 6.5], [9.5, 0, 8.5, 6.5], [0, 7.5, 8.5, 6.5], [9.5, 7.5, 8.5, 6.5]]
  };
  var LAYOUT_NAMES = { "1": "Single pane", "2h": "2 side by side", "2v": "2 stacked", "3c": "3 columns", "3l": "1 + 2 on the right", "3t": "1 + 2 below", "4": "2×2 grid" };
  function layoutSvg(id, scale) {
    scale = scale || 1;
    var r = LAYOUT_RECTS[id] || [];
    return '<svg width="' + 18 * scale + '" height="' + 14 * scale + '" viewBox="0 0 18 14">' +
      r.map(function (q) { return '<rect x="' + q[0] + '" y="' + q[1] + '" width="' + q[2] + '" height="' + q[3] + '" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/>'; }).join("") + "</svg>";
  }

  var I = {
    swap: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h10l-3-3M14 11H4l3 3"/></svg>',
    reload: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>',
    dev: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4 2 8l3.5 4M10.5 4 14 8l-3.5 4"/></svg>',
    close: '<svg width="11" height="11" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>',
    term: "›_",
    detach: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="9" height="9" rx="1.5"/><path d="M7 2h7v7M14 2 8.5 7.5"/></svg>'
  };
  var badgeHtml = function (n) { return n > 0 ? '<span class="badge">' + (n > 99 ? "99+" : n) + "</span>" : ""; };

  function iconFor(p) {
    if (p.kind === "terminal") return '<span style="font-family:Consolas,monospace;font-size:11px;font-weight:700">›_</span>';
    if (p.kind === "url") return p.icon ? esc(p.icon) : "🌐";
    if (p.kind === "empty") return "＋";
    return esc(p.icon || "▣");
  }

  /* ---------- Tab ---------- */
  var renaming = -1;
  var dragTab = -1;
  function renderTabs() {
    var box = $("tabs");
    box.innerHTML = "";
    S.tabs.forEach(function (t, i) {
      if (t.floating) return;
      var el = document.createElement("div");
      el.className = "tab" + (i === S.active ? " active" : "");
      el.title = t.title;
      el.draggable = renaming !== i;
      if (renaming === i) {
        el.innerHTML = '<input value="' + esc(t.customTitle || t.title) + '">';
        var inp = el.querySelector("input");
        var done = function (ok) { if (renaming !== i) return; renaming = -1; send("rename_tab", { index: i, title: ok ? inp.value : (t.customTitle || "") }); renderTabs(); };
        inp.onkeydown = function (e) { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
        inp.onblur = function () { done(true); };
        setTimeout(function () { inp.focus(); inp.select(); }, 0);
      } else {
        el.innerHTML = '<span class="ico">' + (t.icon ? esc(t.icon) : "") + '</span><span class="lbl">' + esc(t.title) + '</span>' +
          (t.count > 1 ? '<span class="lay">' + layoutSvg(t.layout, 0.8) + "</span>" : "") + badgeHtml(t.badge) +
          '<button class="x" title="Close tab">' + I.close + "</button>";
        el.querySelector(".x").onclick = function (e) { e.stopPropagation(); send("close_tab", { index: i }); };
      }
      el.onmousedown = function (e) { if (e.button === 1) { e.preventDefault(); send("close_tab", { index: i }); } };
      el.onclick = function () { if (i !== S.active) send("select_tab", { index: i }); };
      el.ondblclick = function (e) { if (e.target.closest(".x") || S.kiosk) return; renaming = i; renderTabs(); };
      el.ondragstart = function (e) { dragTab = i; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "tab"); };
      el.ondragover = function (e) { if (dragTab < 0) return; e.preventDefault(); el.classList.add("drop-before"); };
      el.ondragleave = function () { el.classList.remove("drop-before"); };
      el.ondrop = function (e) { e.preventDefault(); el.classList.remove("drop-before"); if (dragTab >= 0 && dragTab !== i) send("move_tab", { from: dragTab, to: i }); dragTab = -1; };
      el.ondragend = function () { dragTab = -1; };
      box.appendChild(el);
      if (i === S.active) setTimeout(function () { el.scrollIntoView({ block: "nearest", inline: "nearest" }); }, 0);
    });
  }

  function renderLayouts() {
    var box = $("layouts");
    if (!box.childElementCount) {
      S.layouts.forEach(function (id) {
        var b = document.createElement("button");
        b.className = "tb"; b.dataset.id = id; b.title = LAYOUT_NAMES[id] || id;
        b.innerHTML = layoutSvg(id);
        b.onclick = function () { send("set_layout", { layout: id }); };
        box.appendChild(b);
      });
    }
    Array.prototype.forEach.call(box.children, function (b) { b.classList.toggle("on", b.dataset.id === S.layout); });
  }

  /* ---------- Panes ---------- */
  var paneEls = new Map();
  var spEls = new Map();
  var dragPane = null;

  function pickerHtml(p) {
    var h = "";
    if (S.apps.length) {
      h += "<h3>Apps</h3><div class='cards'>" + S.apps.map(function (a) {
        return '<button class="card" data-app="' + esc(a.id) + '"><span class="ci">' + esc(a.icon || "▣") + '</span><span class="ct"><div class="cn">' + esc(a.name) + '</div><div class="cu">' + esc(a.url) + "</div></span></button>";
      }).join("") + "</div>";
    } else {
      h += "<h3>Apps</h3><div class='empty-hint'>No apps configured: add them in config.json (⚙ Settings).</div>";
    }
    h += "<h3>Terminals</h3><div class='cards'>" + S.shells.map(function (s) {
      return '<button class="card" data-shell="' + esc(s.id) + '"><span class="ci" style="font-family:Consolas,monospace;font-size:12px;font-weight:700">›_</span><span class="ct"><div class="cn">' + esc(s.name) + '</div><div class="cu">' + esc(s.program) + "</div></span></button>";
    }).join("") + "</div>";
    h += "<h3>Notes</h3><div class='cards'><button class='card' data-notes='1'><span class='ci'>📝</span><span class='ct'><div class='cn'>Notes</div><div class='cu'>Local Markdown notebooks</div></span></button></div>";
    h += "<h3>Web address</h3><div class='urlrow'><input class='url' placeholder='https://…' spellcheck='false'><button class='btn go'>Open</button>" +
      (p.picking ? "<button class='btn ghost cancel'>Cancel</button>" : "") + "</div>" +
      "<label class='priv'><input type='checkbox' class='private'> Private page: nothing is stored on disk (cookies, storage, history)</label>";
    return '<div class="picker">' + h + "</div>";
  }

  function bindPicker(el, p) {
    el.querySelectorAll("[data-app]").forEach(function (b) { b.onclick = function () { send("set_content", { pane: p.id, content: { kind: "app", app: b.dataset.app } }); }; });
    el.querySelectorAll("[data-shell]").forEach(function (b) { b.onclick = function () { send("set_content", { pane: p.id, content: { kind: "terminal", shell: b.dataset.shell } }); }; });
    el.querySelectorAll("[data-notes]").forEach(function (b) { b.onclick = function () { send("set_content", { pane: p.id, content: { kind: "notes", notebook: "Inbox" } }); }; });
    var inp = el.querySelector(".url");
    var go = function () {
      var u = inp.value.trim(); if (!u) return;
      if (!/^[a-z]+:\/\//i.test(u)) u = (/^(localhost|127\.|\d+\.\d+\.\d+\.\d+)/.test(u) ? "http://" : "https://") + u;
      send("set_content", { pane: p.id, content: { kind: "url", url: u, private: el.querySelector(".private").checked } });
    };
    el.querySelector(".go").onclick = go;
    inp.onkeydown = function (e) { if (e.key === "Enter") go(); if (e.key === "Escape" && p.picking) send("pick", { pane: p.id, on: false }); };
    var c = el.querySelector(".cancel"); if (c) c.onclick = function () { send("pick", { pane: p.id, on: false }); };
  }

  function place(el, r) {
    el.style.left = r.x + "px"; el.style.top = r.y + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px";
  }

  function renderPanes() {
    var stage = $("stage");
    var seen = new Set();
    S.panes.forEach(function (p) {
      seen.add(p.id);
      var el = paneEls.get(p.id);
      if (!el) {
        el = document.createElement("div");
        el.className = "pane";
        el.innerHTML = '<div class="ph"></div><div class="pb"></div>';
        stage.appendChild(el);
        paneEls.set(p.id, el);
        bindPaneDrag(el, p.id);
      }
      place(el, p.rect);
      el.classList.toggle("focused", !!p.focused && S.panes.length > 1);
      var head = el.querySelector(".ph");
      var hsig = [p.kind, p.title, p.subtitle, p.icon, p.picking, S.devtools, S.kiosk, p.badge, S.panes.length].join("|");
      if (head.dataset.sig !== hsig) {
        head.dataset.sig = hsig;
        var showing = p.kind !== "empty" && !p.picking;
        head.title = p.subtitle ? p.title + " — " + p.subtitle : p.title;
        var k = S.kiosk;
        head.innerHTML = '<span class="ico">' + iconFor(p) + '</span><span class="ttl">' + esc(p.title) + (p.subtitle ? "<small>" + esc(p.subtitle) + "</small>" : "") + "</span>" + badgeHtml(p.badge) +
          (p.kind !== "empty" && !k ? '<button class="hb" data-a="swap" title="Change content">' + I.swap + "</button>" : "") +
          (showing ? '<button class="hb" data-a="reload" title="Reload pane">' + I.reload + "</button>" : "") +
          (showing && !k ? '<button class="hb" data-a="detach" title="Open in a separate window">' + I.detach + "</button>" : "") +
          (showing && S.devtools && p.kind !== "terminal" && p.kind !== "notes" ? '<button class="hb" data-a="dev" title="Developer tools">' + I.dev + "</button>" : "") +
          ((p.kind !== "empty" || S.panes.length > 1) && !k ? '<button class="hb close" data-a="close" title="Close pane">' + I.close + "</button>" : "");
        head.querySelectorAll(".hb").forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            var a = b.dataset.a;
            if (a === "swap") send("pick", { pane: p.id, on: !p.picking });
            else if (a === "reload") send("reload_pane", { pane: p.id });
            else if (a === "dev") send("devtools", { pane: p.id });
            else if (a === "detach") send("detach", { pane: p.id });
            else if (a === "close") send("close_pane", { pane: p.id });
          };
        });
      }
      head.draggable = !S.kiosk;
      head.onmousedown = function (e) { if (!e.target.closest(".hb")) send("focus_pane", { pane: p.id }); };
      var body = el.querySelector(".pb");
      var needPicker = p.kind === "empty" || p.picking;
      var bsig = needPicker ? "picker|" + p.picking + "|" + S.catalogSig : "live";
      if (body.dataset.sig !== bsig) {
        body.dataset.sig = bsig;
        if (needPicker) { body.className = "pb"; body.innerHTML = pickerHtml(p); bindPicker(body, p); }
        else { body.className = "pb live"; body.innerHTML = ""; }
      }
    });
    paneEls.forEach(function (el, id) { if (!seen.has(id)) { el.remove(); paneEls.delete(id); } });

    var seenSp = new Set();
    S.splitters.forEach(function (s) {
      var key = S.tabId + ":" + S.layout + ":" + s.index;
      seenSp.add(key);
      var el = spEls.get(key);
      if (!el) {
        el = document.createElement("div");
        el.className = "sp " + s.axis;
        stage.appendChild(el);
        spEls.set(key, el);
        bindSplitter(el);
      }
      el.dataset.index = s.index; el.dataset.axis = s.axis; el.dataset.min = s.min; el.dataset.max = s.max;
      var pad = 3;
      if (s.axis === "x") place(el, { x: s.rect.x - pad, y: s.rect.y, w: s.rect.w + 2 * pad, h: s.rect.h });
      else place(el, { x: s.rect.x, y: s.rect.y - pad, w: s.rect.w, h: s.rect.h + 2 * pad });
    });
    spEls.forEach(function (el, k) { if (!seenSp.has(k) && !el.classList.contains("drag")) { el.remove(); spEls.delete(k); } });
  }

  function bindSplitter(el) {
    var raf = 0, pending = null;
    el.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add("drag");
      document.body.classList.add("dragging-" + el.dataset.axis);
    });
    el.addEventListener("pointermove", function (e) {
      if (!el.classList.contains("drag")) return;
      var top = $("stage").getBoundingClientRect().top;
      var pos = el.dataset.axis === "x" ? e.clientX : e.clientY - top;
      var min = +el.dataset.min, max = +el.dataset.max;
      pending = (pos - min) / Math.max(1, max - min);
      if (!raf) raf = requestAnimationFrame(function () { raf = 0; send("ratio", { index: +el.dataset.index, value: pending }); });
    });
    var end = function (e) {
      if (!el.classList.contains("drag")) return;
      el.classList.remove("drag");
      document.body.classList.remove("dragging-x", "dragging-y");
      try { el.releasePointerCapture(e.pointerId); } catch (x) {}
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (pending !== null) send("ratio", { index: +el.dataset.index, value: pending });
      pending = null;
      send("ratio_end");
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("dblclick", function () { send("ratio_reset", { index: +el.dataset.index }); });
  }

  function bindPaneDrag(el, id) {
    var head = el.querySelector(".ph");
    head.addEventListener("dragstart", function (e) { dragPane = id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "pane"); });
    head.addEventListener("dragend", function () { dragPane = null; paneEls.forEach(function (x) { x.classList.remove("drop"); }); });
    el.addEventListener("dragover", function (e) { if (dragPane !== null && dragPane !== id) { e.preventDefault(); el.classList.add("drop"); } });
    el.addEventListener("dragleave", function () { el.classList.remove("drop"); });
    el.addEventListener("drop", function (e) { e.preventDefault(); el.classList.remove("drop"); if (dragPane !== null && dragPane !== id) send("swap_panes", { a: dragPane, b: id }); dragPane = null; });
  }

    h += sec("Templates (saved tilesets)") + "<div class='row' style='align-items:center;margin-top:0'><input class='f' id='tplname' placeholder='Name for the current tab' size='26'><button class='btn ghost mini' id='tplsave'>Save current tab</button></div>";

      "<span>Updates</span><span class='muted'>" + (S.update.configured ? esc(S.update.status || "—") + " <button class='btn ghost mini' data-c='check_update'>Check</button>" +
        (S.update.available ? " <button class='btn mini' data-c='install_update'>Install " + esc(S.update.available.version) + " and restart</button>" : "") : "not configured (update)") + "</span></div>" +

  /* ---------- Modal: confirmation, lock screen, kiosk exit ---------- */
  var kioskPrompt = false, modalSig = "";
  function renderModal() {
    var m = $("modal"), sig, h = "";
    if (S.locked || kioskPrompt) {
      sig = "lock|" + S.locked + "|" + kioskPrompt;
      if (modalSig === sig) return;
      h = "<div class='mbox' style='text-align:center'><h3>" + (S.locked ? "🔒 Brust is locked" : "Leave kiosk mode") + "</h3><p>" + (S.locked ? "Enter your PIN to continue." : (S.pinSet ? "Enter the PIN." : "No PIN is set: press Enter to continue.")) + "</p>" +
        "<input class='pin' id='pinin' type='password' autocomplete='off'><div class='pinerr' id='pinerr'></div>" +
        (kioskPrompt ? "<div class='row' style='justify-content:center'><button class='btn ghost' id='pincancel'>Cancel</button></div>" : "") + "</div>";
      m.className = "show lock"; m.innerHTML = h; modalSig = sig;
      var inp = $("pinin");
      inp.onkeydown = function (e) { if (e.key === "Enter") { send("unlock", { pin: inp.value, kiosk: kioskPrompt }); inp.value = ""; } if (e.key === "Escape" && kioskPrompt) { kioskPrompt = false; send("overlay", { on: false }); renderModal(); } };
      var c = $("pincancel"); if (c) c.onclick = function () { kioskPrompt = false; send("overlay", { on: false }); renderModal(); };
      setTimeout(function () { inp.focus(); }, 30);
      return;
    }
    if (S.confirm) {
      var c = S.confirm;
      sig = "confirm|" + c.seq;
      if (modalSig === sig) return;
      var what = { "shell.exec": "run a program", "shell.open": "open a file or link", "fs.write": "write a file", "fs.remove": "delete a file or folder", "fs.mkdir": "create a folder", "serial.open": "open a serial port", "print.file": "print a file" }[c.cmd] || c.cmd;
      h = "<div class='mbox'><h3>⚠ " + esc(c.app) + " wants to " + esc(what) + "</h3><pre>" + esc(c.detail || c.cmd) + "</pre>" +
        "<p>Allow only if you expected this action." + (c.queued > 1 ? " (" + (c.queued - 1) + " more waiting)" : "") + "</p>" +
        "<div class='row'><button class='btn danger' data-d='deny'>Deny</button><button class='btn ghost' data-d='always'>Always allow</button><button class='btn' data-d='once'>Allow once</button></div></div>";
      m.className = "show"; m.innerHTML = h; modalSig = sig;
      m.querySelectorAll("[data-d]").forEach(function (b) { b.onclick = function () { send("confirm_reply", { seq: c.seq, decision: b.dataset.d }); }; });
      setTimeout(function () { var d = m.querySelector("[data-d='deny']"); if (d) d.focus(); }, 30);
      return;
    }
    if (kioskPrompt) return;
    m.className = ""; m.innerHTML = ""; modalSig = "";
  }

      if (!S.kiosk) add(a.icon || "▣", "Open " + a.name + " here", "focused pane", function () { send("open", { here: true, content: { kind: "app", app: a.id } }); });
    });

      else if (i !== S.active) add("⇥", "Go to tab: " + t.title, "", function () { send("select_tab", { index: i }); });
    });

      add("📝", "Open notes", "", function () { send("open", { content: { kind: "notes", notebook: "Inbox" } }); });
      add("🕶", "New private web page", "nothing stored", function () { send("open", { content: { kind: "url", url: "https://duckduckgo.com/", private: true } }); });
      add("＋", "New tab", "Ctrl+T", function () { send("new_tab"); });
      S.layouts.forEach(function (l) { add("▤", "Layout: " + (LAYOUT_NAMES[l] || l), "", function () { send("set_layout", { layout: l }); }); });
      add("⧉", "Open focused pane in a separate window", "", function () { send("detach"); });
      add("⚙", "Settings", "", function () { setTimeout(openSettings, 0); });

  }
  function score(label, q) {
    if (!q) return 1;
    label = label.toLowerCase(); q = q.toLowerCase();
    var i = label.indexOf(q); if (i >= 0) return 100 - i;
    var j = 0; for (var k = 0; k < label.length && j < q.length; k++) if (label[k] === q[j]) j++;
    return j === q.length ? 10 : 0;
  }
  function renderPalette() {
    var q = $("palq").value.trim();
    var list = paletteItems().map(function (x) { return { x: x, s: score(x.label, q) }; }).filter(function (o) { return o.s > 0; });
    list.sort(function (a, b) { return b.s - a.s; });
    palItems = list.map(function (o) { return o.x; }).slice(0, 60);
    palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
    $("pall").innerHTML = palItems.map(function (x, i) {
      return "<div class='pi" + (i === palSel ? " sel" : "") + "' data-i='" + i + "'><span class='pic'>" + esc(x.icon) + "</span><span class='pil'>" + esc(x.label) + "</span><span class='pih'>" + esc(x.hint) + "</span></div>";
    }).join("") || "<div class='pi'><span class='pil muted'>No results</span></div>";
    $("pall").querySelectorAll("[data-i]").forEach(function (el) {
      el.onmousemove = function () { if (palSel !== +el.dataset.i) { palSel = +el.dataset.i; renderPalette(); } };
      el.onclick = function () { runPalette(+el.dataset.i); };
    });
    var sel = $("pall").querySelector(".sel"); if (sel) sel.scrollIntoView({ block: "nearest" });
  }
  function openPalette() {
    if (!S || S.locked || S.confirm || $("overlay").classList.contains("show")) return;
    send("overlay", { on: true });
    $("palette").classList.add("show"); $("palq").value = ""; palSel = 0; renderPalette();
    setTimeout(function () { $("palq").focus(); }, 20);
  }
  function closePalette(keepOverlay) {
    if (!$("palette").classList.contains("show")) return;
    $("palette").classList.remove("show");
    if (!keepOverlay) send("overlay", { on: false });
  }
  function runPalette(i) {
    var x = palItems[i]; if (!x) return;
    closePalette(false); x.run();
  }
  $("palq").addEventListener("input", function () { palSel = 0; renderPalette(); });
  $("palq").addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, palItems.length - 1); renderPalette(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(palSel - 1, 0); renderPalette(); }
    else if (e.key === "Enter") { e.preventDefault(); runPalette(palSel); }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(false); }
  });
  $("palette").addEventListener("mousedown", function (e) { if (e.target === $("palette")) closePalette(false); });

  $("overlay").addEventListener("mousedown", function (e) { if (e.target === $("overlay")) closeSettings(); });

  /* ---------- General ---------- */
  $("newtab").onclick = function () { send("new_tab"); };
  $("reload").onclick = function () { send("reload_tab"); };
  $("settings").onclick = openSettings;
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey && e.altKey && e.shiftKey && (e.key === "K" || e.key === "k")) {
      e.preventDefault();
      if (S && S.kioskConfigured && S.kiosk) { kioskPrompt = true; send("overlay", { on: true }); renderModal(); }
      return;
    }
    if (e.target.tagName === "INPUT" && e.key !== "F5") return;
    if (S && (S.locked || S.confirm)) return;
    if (e.key === "Escape" && $("overlay").classList.contains("show")) { closeSettings(); return; }
    if (e.ctrlKey && !e.shiftKey && (e.key === "k" || e.key === "K")) { e.preventDefault(); openPalette(); return; }
    if (e.ctrlKey && e.shiftKey && (e.key === "L" || e.key === "l")) { e.preventDefault(); send("lock"); return; }
    if (e.key === "F5" || (e.ctrlKey && (e.key === "r" || e.key === "R"))) { e.preventDefault(); send("reload_tab"); }
    else if (e.ctrlKey && e.key === "Tab") { e.preventDefault(); send("shortcut", { name: e.shiftKey ? "prev_tab" : "next_tab" }); }
    else if (e.ctrlKey && (e.key === "t" || e.key === "T")) { e.preventDefault(); send("new_tab"); }
    else if (e.ctrlKey && (e.key === "w" || e.key === "W")) { e.preventDefault(); if (!S.kiosk) send("close_tab", { index: S.active }); }
    else if (e.altKey && e.key >= "1" && e.key <= "4") { e.preventDefault(); send("shortcut", { name: "focus_pane", index: +e.key - 1 }); }
  });
  document.addEventListener("contextmenu", function (e) { if (e.target.tagName !== "INPUT") e.preventDefault(); });
  ["mousedown", "mouseup", "auxclick"].forEach(function (t) { window.addEventListener(t, function (e) { if (e.button === 3 || e.button === 4) e.preventDefault(); }, true); });

  var toastTimer = 0;
  window.brustShell = {
    update: function (state) {
      S = state;
      S.catalogSig = JSON.stringify([S.apps.map(function (a) { return a.id + a.name + a.url + a.icon; }), S.shells.map(function (s) { return s.id + s.name; })]);
      document.documentElement.style.setProperty("--bar-h", S.barHeight + "px");
      document.documentElement.style.setProperty("--head-h", S.headerHeight + "px");
      document.body.classList.toggle("kiosk", !!S.kiosk);
      $("settings").style.display = S.kiosk ? "none" : "";
      if (!S.kiosk && kioskPrompt) kioskPrompt = false;
      if (S.locked || S.confirm) { closePalette(true); }
      renderTabs(); renderLayouts(); renderPanes(); renderSettings(); renderModal();
      if ($("palette").classList.contains("show")) renderPalette();
    },
    palette: function () { openPalette(); },
    kioskExit: function () { if (S && S.kiosk) { kioskPrompt = true; send("overlay", { on: true }); renderModal(); } },
    pinError: function (msg) {
      var e = $("pinerr") || $("seterr");
      if (e) e.textContent = msg;
      var i = $("pinin"); if (i) { i.value = ""; i.focus(); }
    },
    auditLog: function (entries) { showAudit(entries); },
    toast: function (msg) {
      var t = $("toast"); t.textContent = msg; t.style.display = "block";
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = "none"; }, 6000);
    }
  };
  send("ready");
})();
</script>
</body>
</html>
