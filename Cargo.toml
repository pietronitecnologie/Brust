[package]
name = "brust"
version = "0.1.0"
edition = "2024"
description = "Dedicated desktop client for web apps, with a bridge to local hardware/software, tabs and tiles."

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
directories = "6.0.0"
env_logger = "0.11.12"
log = "0.4.35"
open = "5.4.5"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
tao = "0.37.3"
tungstenite = "0.30.0"
wry = { version = "0.57.3", features = ["devtools"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
